<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundbliz</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
  #root{display:flex;height:100%;align-items:stretch}
  #panel{width:380px;padding:36px 24px;display:flex;flex-direction:column;gap:14px;background:#0d0d12;flex:none}
  #panel h1{font-size:36px;margin:0 0 14px 8px}
  .b{font-size:26px;padding:16px 20px;border-radius:12px;border:2px solid #555;background:#1a1a24;color:#fff;cursor:pointer;text-align:left}
  .b:focus,.b:hover{background:#fff;color:#000;outline:none}
  #hint{font-size:20px;color:#aaa;line-height:1.4;margin:8px;white-space:pre-line}
  #stage{flex:1;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;background:#000}
  #frameBox{transform-origin:top center;background:#111}
  iframe{border:0;display:block;background:#fff}
</style>
</head>
<body>
<div id="root">
  <div id="panel">
    <h1>Soundbliz</h1>
    <button class="b" id="bMenu">⟵ Volver</button>
    <button class="b" id="bReload">⟳ Recargar</button>
    <button class="b" id="bBig">＋ Más grande</button>
    <button class="b" id="bSmall">－ Más pequeño</button>
    <button class="b" id="bFull">Abrir normal (pantalla completa)</button>
    <div id="hint">Versión móvil: usa el puntero del Magic Remote dentro de la pantalla del teléfono.
Si ves la pantalla en blanco, el sitio no permite mostrarse así: usa "Abrir normal".</div>
  </div>
  <div id="stage"><div id="frameBox"><iframe id="f" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>
</div>
<script>
(function(){
var hosted = /^https?:$/.test(window.location.protocol || "");
var qParam = ""; try { qParam = new URLSearchParams(window.location.search).get("q") || ""; } catch(e){}
var URL_SB = qParam ? "https://soundbliz.com/search/" + encodeURIComponent(qParam) : "https://soundbliz.com/";
function goBack(){
  if(qParam && window.history.length > 1){ window.history.back(); return; }
  if(hosted && window.history.length > 1){ window.history.back(); return; }
  window.location.href = "index.html";
}
var PHONE_W = 390;                  // ancho CSS del "teléfono"
var f = document.getElementById("f"), box = document.getElementById("frameBox");
var scale = 1.5;
try { var sv = parseFloat(localStorage.getItem("sb_scale")); if(sv >= 1 && sv <= 2.4) scale = sv; } catch(e){}

function layout(){
  var h = window.innerHeight / scale;       // alto CSS del teléfono para llenar la pantalla
  f.style.width = PHONE_W + "px"; f.style.height = Math.floor(h) + "px";
  box.style.width = PHONE_W + "px"; box.style.height = Math.floor(h) + "px";
  box.style.transform = "scale(" + scale + ")";
}
function setScale(v){
  scale = Math.max(1, Math.min(2.4, Math.round(v * 10) / 10));
  try { localStorage.setItem("sb_scale", String(scale)); } catch(e){}
  layout();
}
function load(){ f.src = URL_SB; }
document.getElementById("bMenu").onclick = goBack;
document.getElementById("bReload").onclick = load;
document.getElementById("bBig").onclick = function(){ setScale(scale + 0.1); };
document.getElementById("bSmall").onclick = function(){ setScale(scale - 0.1); };
document.getElementById("bFull").onclick = function(){ window.location.href = URL_SB; };
window.addEventListener("resize", layout);

var btns = [].slice.call(document.querySelectorAll(".b"));
document.addEventListener("keydown", function(e){
  var k = e.keyCode, i = btns.indexOf(document.activeElement);
  if(k === 40){ btns[(i + 1) % btns.length].focus(); e.preventDefault(); }
  else if(k === 38){ btns[(i - 1 + btns.length) % btns.length].focus(); e.preventDefault(); }
  else if(k === 39){ f.focus(); e.preventDefault(); }
  else if(k === 13 && i >= 0){ btns[i].click(); e.preventDefault(); }
  else if(k === 461 || k === 27){ e.preventDefault(); goBack(); }
});
layout(); load(); btns[0].focus();
})();
</script>
</body>
</html>
